name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:package
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.14
      - run: uv run --locked --project maintenance python -m unittest discover -s maintenance
